<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFD700">
<title>Tulivu Bookings</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tulivu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<style>
:root{
  --y:#FFD700; --y-deep:#F2C200; --y-soft:#FFF5C2; --y-pale:#FFFBE6;
  --ink:#141414; --ink-2:#2b2b2b; --muted:#6f6b5e; --line:#ECE5CF; --bg:#FBF8EE; --card:#fff;
  --res:#2453B8; --res-soft:#E4ECFF; --in:#17784A; --in-bar:#1F9A5E; --in-soft:#DFF3E8;
  --out:#5f6262; --out-soft:#ECEBE6; --bad:#B3361C; --bad-soft:#FDE4DE;
  --r:16px; --shadow:0 1px 2px rgba(40,30,0,.06),0 6px 18px rgba(40,30,0,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);font-size:16px}
.hidden{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safe-b))}
header.top{position:sticky;top:0;z-index:20;background:var(--y);padding:calc(10px + var(--safe-t)) 16px 10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:46px;display:block}
.brand .sub{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-left:1.5px solid rgba(0,0,0,.25);padding-left:11px;line-height:1.25}
.sync{margin-left:auto;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);padding:5px 9px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#b58d00}
.dot.ok{background:#17A05A}.dot.bad{background:#d23c1c}
main{padding:16px}
.banner{background:var(--y-soft);border:1px solid #f1dc7a;color:#5e4a00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.banner.err{background:var(--bad-soft);border-color:#f2bfb2;color:#8a2a14}
h2.sec{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{font-family:'DM Sans';font-size:12px;background:var(--y-soft);color:#6b5600;padding:2px 8px;border-radius:20px;font-weight:700}
.date-hero{margin:2px 2px 14px}
.date-hero .d{font-family:'Fraunces',serif;font-size:24px;font-weight:600;line-height:1.1}
.date-hero .s{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:11px 6px 10px;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--y)}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:9px}
.bk{display:flex;gap:12px;align-items:center;padding:12px}
.bk .tap{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.ub{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:17px;background:var(--y);color:var(--ink);line-height:1}
.ub.studio{background:var(--ink);color:var(--y)}
.ub small{display:block;font-size:8px;font-weight:700;letter-spacing:.5px;margin-top:2px;opacity:.85}
.bk .mid{flex:1;min-width:0}
.bk .g{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.p-reserved{background:var(--res-soft);color:var(--res)}
.p-checked_in{background:var(--in-soft);color:var(--in)}
.p-checked_out{background:var(--out-soft);color:var(--out)}
.p-cancelled{background:var(--bad-soft);color:var(--bad)}
.p-late{background:var(--bad);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--ink);color:var(--y);white-space:nowrap}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn.green{background:var(--in-bar);color:#fff}.btn.red{background:var(--bad);color:#fff}
.btn.yellow{background:var(--y);color:var(--ink)}
.btn.ghost{background:#efe9d6;color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%;padding:15px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.unit{padding:12px;text-align:left;border-left:5px solid var(--in-bar);min-height:106px;display:flex;flex-direction:column;width:100%}
.unit.vacant{border-left-color:#d9d3bf}.unit.arriving{border-left-color:var(--res)}.unit.due{border-left-color:var(--bad)}
.unit .h{display:flex;justify-content:space-between;align-items:center}
.unit .n{font-weight:700;font-size:15px}
.unit .t{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.unit .who{font-weight:600;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .sub{font-size:12px;color:var(--muted);margin-top:2px}
.unit .st{margin-top:auto;padding-top:8px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#8d8775}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{background:var(--y);border-radius:10px;box-shadow:0 0 0 5px var(--y)}
nav.tabs svg{width:22px;height:22px}
nav.tabs .add{position:relative;top:-14px}
nav.tabs .add span{width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--y);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.28)}
nav.tabs .add span svg{width:26px;height:26px;background:none!important;box-shadow:none!important}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calnav .lbl{flex:1;text-align:center;font-weight:700;font-size:14px}
.calwrap{overflow-x:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.cgrid{display:grid;grid-template-columns:72px repeat(14,46px);width:max-content}
.cgrid>*{grid-row:1}
.crow{border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.clabel{position:sticky;left:0;z-index:3;background:var(--card);padding:10px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;grid-column:1}
.clabel b{font-size:14px}.clabel span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.chead .clabel{background:var(--y-pale)}
.chead .dh{text-align:center;padding:8px 0 7px;font-size:10.5px;color:var(--muted);font-weight:600;border-right:1px solid #f4efe0;background:var(--y-pale)}
.chead .dh b{display:block;font-size:15px;color:var(--ink);margin-top:1px}
.chead .dh.today b{background:var(--ink);color:var(--y);border-radius:8px;width:26px;margin:1px auto 0;padding:1px 0}
.cell{height:58px;border-right:1px solid #f4efe0}
.cell.we{background:#fdfbf3}.cell.today{background:var(--y-soft)}
.bar{z-index:2;margin:9px 2px;border-radius:10px;padding:5px 7px;font-size:11.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.bar small{font-weight:500;opacity:.85;font-size:10px}
.bar.reserved{background:var(--res-soft);color:var(--res);border:1.5px solid #9db5ec}
.bar.checked_in{background:var(--in-bar);color:#fff}
.bar.checked_out{background:var(--out-soft);color:var(--out)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);margin-bottom:10px;outline:none}
.search:focus{border-color:var(--y-deep)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{padding:7px 12px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--y)}
.scrim{position:fixed;inset:0;background:rgba(20,18,8,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + var(--safe-b))}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#d9cfae;margin:4px auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-h h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:0}
.x{width:34px;height:34px;border-radius:50%;background:#efe9d6;display:grid;place-items:center;font-size:20px;line-height:1}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 2px 5px;letter-spacing:.4px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--y-deep);box-shadow:0 0 0 3px var(--y-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.uchip{padding:10px 6px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:center}
.uchip b{display:block;font-size:14.5px}
.uchip span{font-size:10.5px;font-weight:700;color:var(--in)}
.uchip.on{border-color:var(--ink);background:var(--y);color:var(--ink)}
.uchip.on span{color:var(--ink)}
.uchip.busy{background:var(--out-soft);color:#9a978c;border-style:dashed}
.uchip.busy span{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted);margin:4px 2px 0;line-height:1.45}
.err-box{background:var(--bad-soft);color:#8a2a14;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.kv{display:grid;grid-template-columns:108px 1fr;gap:9px 10px;font-size:14px;padding:14px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:600}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.actions .full{grid-column:1/-1}
.log{font-size:12.5px;color:var(--muted);padding:12px 14px;line-height:1.65}
.dethead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dethead .g{font-family:'Fraunces',serif;font-size:21px;font-weight:600}
.dethead .r{font-size:12px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--y);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);gap:10px}
.set-row:last-child{border-bottom:0}
.set-row input{width:120px;padding:9px;border-radius:10px;border:1.5px solid var(--line);text-align:right;background:#fff}
textarea.code{width:100%;height:120px;font-size:11px;font-family:monospace;border-radius:10px;border:1.5px solid var(--line);padding:8px;margin-top:10px;background:#fff}
.spinner{width:28px;height:28px;border:3px solid var(--y-soft);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
/* gate screens */
.gate{min-height:100vh;background:var(--y);display:flex;flex-direction:column;align-items:center;padding:calc(48px + var(--safe-t)) 22px calc(30px + var(--safe-b))}
.gate img{width:min(70vw,300px);margin-bottom:8px}
.gate .tag{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:26px}
.gate .box{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(80,60,0,.18)}
.gate h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px}
.gate p{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.gate textarea{width:100%;height:150px;font-family:monospace;font-size:12px;padding:10px;border-radius:12px;border:1.5px solid var(--line);outline:none}
.linkbtn{color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:underline;padding:12px 4px 0;display:block;margin:0 auto}
</style>
</head>
<body>
<div id="gate"></div>
<div id="shell" class="hidden">
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="assets/logo-ink.png" alt="Tulivu Suites">
      <div class="sub">Booking<br>Office</div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Connecting…</span></div>
    </div>
  </header>
  <main id="main"><div class="spinner"></div><div class="empty">Loading bookings…</div></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="add" data-action="new" aria-label="New booking"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Bookings</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</button>
</div></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
